<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERALL BEST WORKER 2025 – KWATIRE GOVERNMENT HOSPITAL</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .header { background-color: #28a745; color: white; padding: 25px 20px; text-align: center; }
    .header img { width: 100px; vertical-align: middle; margin-right: 10px; }
    .header h1 { margin: 5px 0; font-size: 26px; }
    .header h2 { 
      margin: 0; 
      font-size: 20px; 
      color: #ffd700 !important; 
      font-weight: 700; 
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7); 
    }
    .container { max-width: 1000px; margin: 20px auto; padding: 20px; background-color: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    .parameter { color: #8b0000; font-weight: bold; font-size: 1.1rem; margin-bottom: 1rem; }
    .score-group { 
      margin: 1.8rem 0; 
      border: 1px solid #ddd; 
      padding: 1.2rem; 
      border-radius: 10px; 
      background: #f9f9f9; 
    }
    .score-group h3 { margin-bottom: 1rem; color: #2c3e50; }
    .score-group label { 
      display: flex; 
      align-items: center; 
      padding: 0.8rem; 
      margin: 0.4rem 0; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: background 0.2s; 
    }
    .score-group label:hover { background: #e8f5e9; }
    .nominee { flex: 1; display: flex; align-items: center; gap: 12px; }
    .nominee img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    button { 
      background-color: #28a745; 
      color: white; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 1.05rem; 
      margin: 10px 5px; 
      transition: all 0.2s; 
    }
    button:hover { background-color: #218838; transform: translateY(-2px); }
    .reset-btn { background-color: #6c757d; }
    .reset-btn:hover { background-color: #5a6268; }
    .summary-table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
    .summary-table th, .summary-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .summary-table th { background-color: #e8f5e9; color: #1e7e34; }
  </style>
</head>
<body>
  <div class="container" id="container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFgBeYSQkgYxy12dpzO0QFne271J_Gi6A",
      authDomain: "kgh-staff-elections.firebaseapp.com",
      databaseURL: "https://kgh-staff-elections-default-rtdb.firebaseio.com",
      projectId: "kgh-staff-elections",
      storageBucket: "kgh-staff-elections.firebasestorage.app",
      messagingSenderId: "733962213751",
      appId: "1:733962213751:web:93a8060d3c5555ee0e2972",
      measurementId: "G-7CH9GTZBD4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const parameters = [
      "PUNCTUALITY",
      "ATTITUDE TOWARDS WORK",
      "ATTITUDE TOWARDS COWORKERS",
      "DISCIPLINE",
      "INNOVATIVE",
      "DRESSING",
      "WILLINGNESS TO ACCEPT ADDITIONAL TASK"
    ];

    const scores = [
      { label: "FAIR", value: 1 },
      { label: "ACCEPTABLE", value: 2 },
      { label: "GOOD", value: 3 },
      { label: "VERY GOOD", value: 4 },
      { label: "EXCELLENT", value: 5 },
      { label: "OUTSTANDING", value: 6 },
      { label: "EXCEPTIONAL", value: 7 },
      { label: "SUPERB", value: 8 },
      { label: "REMARKABLE", value: 9 },
      { label: "LEGENDARY", value: 10 }
    ];

    const nominees = [
      { name: "Sandra Amolaley", photo: "https://i.imgur.com/B40wHuw.jpeg" },
      { name: "Philomina Etornam Dzirasa", photo: "https://i.imgur.com/79heoUm.jpeg" },
      { name: "Dr. Dennis Asaah Kwofie", photo: null },
      { name: "Desmond Amoako Atta", photo: "https://i.imgur.com/NqOrfat.jpeg" },
      { name: "Josephine Pomaa", photo: "https://i.imgur.com/8Oh8Err.jpeg" },
      { name: "Anthony Boakye Ansah", photo: "https://i.imgur.com/RKkoJzM.jpeg" },
      { name: "Oteng Alpha", photo: "https://i.imgur.com/NnCh3Gd.jpeg" },
      { name: "Samuel Twene", photo: "https://i.imgur.com/JnoTAlY.jpeg" },
      { name: "Amos Doe", photo: "https://i.imgur.com/iZyuW8k.jpeg" },
      { name: "Frederick Tabiri", photo: "https://i.imgur.com/7v05aUw.jpeg" }
    ];

    let step = 0;
    let voterDetails = { staffId: "", surname: "", middleName: "", otherName: "" };
    let votes = {};

    function getPhotoUrl(nominee) {
      return nominee.photo || `https://via.placeholder.com/50x50/cccccc/000000?text=${nominee.name.charAt(0)}`;
    }

    function render() {
      const container = document.getElementById("container");
      if (!container) return;

      container.innerHTML = `
        <div class="header">
          <img src="https://i.imgur.com/jM246HZ.jpg" alt="Ghana Health Service Logo">
          <div>
            <h1>KWATIRE GOVERNMENT HOSPITAL</h1>
            <h2>OVERALL BEST WORKER 2025</h2>
          </div>
        </div>
      `;

      if (step === 0) {
        container.innerHTML += `
          <h2>Voter Details</h2>
          <div class="form-group">
            <label for="staffId">Staff ID <span class="required">*</span></label>
            <input type="text" id="staffId" placeholder="Enter your Staff ID" required>
          </div>
          <div class="form-group">
            <label for="surname">Surname <span class="required">*</span></label>
            <input type="text" id="surname" placeholder="Enter your Surname" required>
          </div>
          <div class="form-group">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName" placeholder="Enter your Middle Name">
          </div>
          <div class="form-group">
            <label for="otherName">Other Name</label>
            <input type="text" id="otherName" placeholder="Enter your Other Name">
          </div>
          <button onclick="nextStep()">Next</button>
          <button onclick="viewResultsDirectly()">View Accumulated Results</button>
        `;
      } else if (step > 0 && step <= parameters.length) {
        const paramIndex = step - 1;
        const parameter = parameters[paramIndex];
        const currentVotes = votes[parameter] || {};

        container.innerHTML += `
          <h2>Vote for ${parameter}</h2>
          <p class="parameter">${parameter}</p>
          <p style="color:#555; margin-bottom:1.5rem;">
            Please assign each score to a different nominee (<strong>10 unique scores required</strong>):
          </p>
          ${scores.map(score => `
            <div class="score-group">
              <h3>${score.label} (${score.value})</h3>
              <button class="clear-btn" onclick="clearScore('${parameter}', ${score.value}, ${paramIndex})">Clear</button>
              ${nominees.map(nominee => {
                const isChecked = currentVotes[nominee.name] === score.value;
                const isDisabled = Object.keys(currentVotes).includes(nominee.name) && !isChecked;
                return `
                  <label class="nominee">
                    <input type="radio"
                           name="score-${score.value}-${paramIndex}"
                           value="${nominee.name}"
                           ${isChecked ? 'checked' : ''}
                           ${isDisabled ? 'disabled' : ''}
                           onchange="recordVote('${parameter}', '${nominee.name}', ${score.value}, ${paramIndex})">
                    <img src="${getPhotoUrl(nominee)}" alt="${nominee.name}">
                    ${nominee.name}
                  </label>
                `;
              }).join('')}
            </div>
          `).join('')}
          <div style="text-align:center; margin-top:2rem;">
            <button onclick="nextStep()">Next</button>
            <button class="reset-btn" onclick="resetVotes()">Reset All Votes</button>
          </div>
        `;
      } else if (step === parameters.length + 1) {
        container.innerHTML += `
          <h2>Review Your Votes</h2>
          <table class="summary-table">
            <tr>
              <th>Parameter</th>
              ${nominees.map(n => `<th><img src="${getPhotoUrl(n)}" alt="${n.name}" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;"> ${n.name}</th>`).join('')}
            </tr>
            ${parameters.map(param => `
              <tr>
                <td>${param}</td>
                ${nominees.map(n => `
                  <td>${votes[param]?.[n.name] ? scores.find(s => s.value === votes[param][n.name]).label : '-'}</td>
                `).join('')}
              </tr>
            `).join('')}
          </table>
          <div style="text-align:center; margin-top:2rem;">
            <button onclick="submitVotes()">Submit Votes</button>
            <button class="reset-btn" onclick="resetVotes()">Reset All Votes</button>
            <button onclick="calculateResults()">View Results</button>
            <button onclick="viewSubmittedVotes()">Admin: View Submitted Votes</button>
          </div>
        `;
      } else if (step === parameters.length + 2) {
        container.innerHTML += `
          <div style="text-align:center; padding:3rem 1rem;">
            <h2 style="color:var(--primary);">Thank You!</h2>
            <p style="font-size:1.3rem; margin:1.5rem 0;">
              YOUR VOTES HAVE BEEN SUBMITTED SUCCESSFULLY<br>
              Thank you for participating!
            </p>
          </div>
        `;
      }
    }

    function nextStep() {
      console.log("Next clicked, step:", step);

      if (step === 0) {
        voterDetails.staffId = document.getElementById("staffId")?.value.trim() || "";
        voterDetails.surname = document.getElementById("surname")?.value.trim() || "";
        voterDetails.middleName = document.getElementById("middleName")?.value.trim() || "";
        voterDetails.otherName = document.getElementById("otherName")?.value.trim() || "";

        if (!voterDetails.staffId || !voterDetails.surname) {
          alert("Please fill in Staff ID and Surname.");
          return;
        }

        localStorage.setItem('voterDetails', JSON.stringify(voterDetails));
        step++;
        render();
        return;
      }

      if (step > 0 && step <= parameters.length) {
        const paramIndex = step - 1;
        const parameter = parameters[paramIndex];
        const currentVotes = votes[parameter] || {};
        const assignedScores = new Set(Object.values(currentVotes));

        if (assignedScores.size !== scores.length) {
          const missing = scores.filter(s => !assignedScores.has(s.value)).map(s => s.label);
          alert(`Please assign all 10 scores for ${parameter}: ${missing.join(', ')}`);
          return;
        }

        const assignedNominees = new Set(Object.keys(currentVotes));
        if (assignedNominees.size !== scores.length) {
          alert(`Each score must go to a different nominee (10 required).`);
          return;
        }
      }

      step++;
      render();
    }

    // ... (keep all other functions the same: recordVote, clearScore, resetVotes, submitVotes, calculateResults, viewSubmittedVotes, viewResultsDirectly)

    render();
  </script>
</body>
</html>
